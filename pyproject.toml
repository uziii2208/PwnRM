[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pwnrm"
version = "1.2.5"
description = "Advanced WinRM / AD Post-Exploitation Shell"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "uziii2208"}
]
keywords = ["winrm", "activedirectory", "pentest", "redteam", "impacket"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
requires-python = ">=3.9"
dependencies = [
    "impacket>=0.12.0",
    "requests>=2.28.0",
    "urllib3>=1.26.0",
    "pyasn1>=0.4.8",
    "pycryptodomex>=3.18.0",
    "cryptography>=41.0.0",
    "prompt-toolkit>=3.0.0",
    "defusedxml>=0.7.1",
    "pypsrp>=0.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
pwnrm = "pwnrm.cli:main"

[project.urls]
Homepage = "https://github.com/uziii2208/PwnRM"
Repository = "https://github.com/uziii2208/PwnRM"
Issues = "https://github.com/uziii2208/PwnRM/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pwnrm = ["resources/*.ps1"]